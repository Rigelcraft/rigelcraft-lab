<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Galáctico | Rigelcraft Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Angkor&family=Anton&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("torneo.png");
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            padding-bottom: 50px;
        }

        hr {
            border: none;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #0184ff, #00ccff, #00ffb3);
            box-shadow: 0 0 10px #00ccff, 0 0 10px #00c3ff;
            margin: 30px 0;
        }

        /* Navegación Breadcrumb */
        .breadcrumb {
            text-align: left;
            width: 100%;
            margin: 20px 0 40px 2%;
            font-size: 20px;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000;
        }

        .breadcrumb a {
            color: #00c3ff;
            text-decoration: underline;
            font-weight: bold;
            transition: 0.3s;
            text-shadow: 0 0 5px #000;
        }

        .breadcrumb a:hover {
            color: #fff;
            text-shadow: 0 0 10px #00ccff, 0 0 20px #00c3ff;
        }

        .breadcrumb span {
            color: #00c3ff;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
        }

        /* Estilos del Mega Título */
        .contenedor-mega-titulo {
            text-align: left;
            width: 100%;
            margin: 20px 0 20px 2%;
            max-width: 98%;
            overflow-x: visible;
        }

        .mega-titulo {
            font-family: 'Angkor', 'Anton', Arial, sans-serif;
            font-size: clamp(40px, 8vw, 130px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1;
            background-image: url('https://static.vecteezy.com/system/resources/previews/006/059/573/non_2x/blue-water-surface-background-waves-of-sea-ocean-pool-and-lake-light-ripple-texture-seamless-pattern-vector.jpg');
            background-size: 400px;
            background-repeat: repeat;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            -webkit-text-stroke: 1.5px #003050;
            filter: drop-shadow(0 0 10px #00ccff) drop-shadow(0 0 20px #00e1ff);
            max-width: 95%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: block;
            padding-right: 2px;
            box-sizing: border-box;
        }

        h3 {
            color: #e6edf3;
            font-size: 25px;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000;
            margin-left: 2%;
            text-align: left;
        }

        p {
            color: #e6edf3;
            font-size: 22px;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000;
            margin-left: 2%;
            text-align: left;
            margin-top: 15px;
        }

        /* Grid del Torneo Galáctico */
        .grid-grupos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 96%;
            margin: 30px auto;
        }

        .tarjeta-grupo {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ccff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 0 12px rgba(0, 204, 255, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .tarjeta-grupo:hover {
            box-shadow: 0 0 22px rgba(0, 204, 255, 0.6);
            transform: translateY(-3px);
        }

        .titulo-grupo {
            color: #00fff2;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #00ccff;
            padding-bottom: 8px;
            text-shadow: 0 0 6px #000;
        }

        .fila-participante {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        /* Medallas / Badges de Posición */
        .posicion-badge {
            font-size: 13px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 6px;
            min-width: 32px;
            text-align: center;
            color: #fff;
        }

        .pos-1, .pos-2 {
            background-color: #00c853;
            box-shadow: 0 0 8px #00c853;
        }

        .pos-3 {
            background-color: #ff9100;
            box-shadow: 0 0 8px #ff9100;
        }

        .pos-4 {
            background-color: #d50000;
            box-shadow: 0 0 6px #d50000;
        }

        .info-participante {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .avatar-participante {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #00c3ff;
            object-fit: cover;
            background-color: #111;
        }

        .nombre-participante {
            color: #e6edf3;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 4px #000;
        }

        /* Inputs para ingresar votos manualmente */
        .input-votos {
            width: 75px;
            padding: 6px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 1.5px solid #00fff2;
            border-radius: 6px;
            color: #ffe600;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-votos:focus {
            border-color: #ffe600;
            box-shadow: 0 0 10px #ffe600;
        }

        /* Botón de Acción Principal y Reset */
        .contenedor-botones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 40px auto 20px auto;
            width: 96%;
        }

        .btn-cerrar-fase {
            background: linear-gradient(135deg, #00c3ff, #0051ff);
            color: #ffffff;
            font-family: 'Anton', Arial, sans-serif;
            font-size: clamp(18px, 4vw, 26px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px 35px;
            border: 2px solid #00fff2;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5), inset 0 0 10px rgba(0, 255, 242, 0.3);
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #000;
        }

        .btn-cerrar-fase:hover {
            background: linear-gradient(135deg, #ffe600, #ff8800);
            color: #000;
            border-color: #ffe600;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.8), inset 0 0 15px rgba(255, 255, 0, 0.5);
            transform: scale(1.03);
            text-shadow: none;
        }

        .btn-resetear {
            background: rgba(213, 0, 0, 0.3);
            color: #ff5252;
            font-family: 'Anton', Arial, sans-serif;
            font-size: clamp(16px, 3vw, 20px);
            padding: 16px 25px;
            border: 2px solid #ff5252;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-resetear:hover {
            background: #d50000;
            color: #fff;
            box-shadow: 0 0 15px #d50000;
        }

        /* Optimización Responsive */
        @media (max-width: 600px) {
            body { 
                background-attachment: fixed; 
                background-position: 50% center !important;
            }
            .mega-titulo {
                font-size: clamp(25px, 11vw, 50px) !important; 
                -webkit-text-stroke: 1px #003050;
                text-align: center !important;
                margin: 0 auto !important;
                display: block;
                background-size: 250px;
                width: 90%;
            }
            .breadcrumb {
                font-size: 16px !important;
                margin-left: 4% !important;
            }
            p, h3 {
                font-size: 18px !important;
                margin-left: 5% !important;
                margin-right: 5% !important;
            }
            .grid-grupos {
                grid-template-columns: 1fr;
                width: 92%;
            }
            .contenedor-mega-titulo {
                text-align: center !important;
                margin-left: 0 !important;
                width: 100% !important;
            }
            .btn-cerrar-fase, .btn-resetear {
                width: 92%;
                padding: 14px 10px;
            }
        }
    </style>
</head>

        let torneoGalactico = {};

        // Cargar desde localStorage o inicializar datos
        function cargarDatosTorneo() {
            const guardado = localStorage.getItem("torneo_galactico_data");
            if (guardado) {
                try {
                    torneoGalactico = JSON.parse(guardado);
                } catch (e) {
                    torneoGalactico = JSON.parse(JSON.stringify(torneoBase));
                }
            } else {
                torneoGalactico = JSON.parse(JSON.stringify(torneoBase));
            }
        }

        function guardarEnLocalStorage() {
            localStorage.setItem("torneo_galactico_data", JSON.stringify(torneoGalactico));
        }

        // Renderizado ordenado por posición en tiempo real
        function renderizarPanelGrupos() {
            const contenedor = document.getElementById("contenedor-grupos");
            if (!contenedor) return;

            let htmlContenido = "";

            torneoGalactico.grupos.forEach(grupo => {
                // Copia y ordena a los participantes por votos descendente
                const ordenados = [...grupo.participantes].sort((a, b) => b.votos - a.votos);

                htmlContenido += `
                    <div class="tarjeta-grupo" id="card-${grupo.id}">
                        <h3 class="titulo-grupo">${grupo.nombre}</h3>
                        <div class="lista-participantes">
                `;

                ordenados.forEach((participante, idx) => {
                    const numPos = idx + 1;
                    htmlContenido += `
                        <div class="fila-participante">
                            <span class="posicion-badge pos-${numPos}">${numPos}º</span>
                            <div class="info-participante">
                                <img src="${participante.foto}" alt="${participante.nombre}" class="avatar-participante" onerror="this.src='https://via.placeholder.com/38/000000/00fff2?text=P'">
                                <span class="nombre-participante">${participante.nombre}</span>
                            </div>
                            <input 
                                type="number" 
                                class="input-votos" 
                                min="0" 
                                value="${participante.votos}" 
                                data-grupo="${grupo.id}" 
                                data-participante="${participante.id}"
                                placeholder="0"
                            >
                        </div>
                    `;
                });

                htmlContenido += `
                        </div>
                    </div>
                `;
            });

            contenedor.innerHTML = htmlContenido;
            asignarEventosInputs();
        }

        function actualizarVoto(grupoId, participanteId, valor) {
            const votosNum = parseInt(valor) || 0;
            const grupo = torneoGalactico.grupos.find(g => g.id === grupoId);
            if (grupo) {
                const participante = grupo.participantes.find(p => p.id === participanteId);
                if (participante) {
                    participante.votos = votosNum;
                    guardarEnLocalStorage();
                    renderizarPanelGrupos(); // Reordenar la vista al instante
                }
            }
        }

        function asignarEventosInputs() {
            const inputs = document.querySelectorAll(".input-votos");
            inputs.forEach(input => {
                input.addEventListener("change", (e) => {
                    const grupoId = e.target.getAttribute("data-grupo");
                    const participanteId = e.target.getAttribute("data-participante");
                    actualizarVoto(grupoId, participanteId, e.target.value);
                });
            });
        }

        // Cierre de Fase
        function iniciarCalculoClasificacion() {
            guardarEnLocalStorage();
            alert("🚀 ¡Fase de grupos guardada exitosamente!\n\nDatos sincronizados. Listos para pasar al módulo de cálculo y ranking global.");
        }

        // Reset
        function resetearTorneo() {
            if (confirm("⚠️ ¿Seguro que deseas resetear todos los votos a 0?")) {
                localStorage.removeItem("torneo_galactico_data");
                cargarDatosTorneo();
                renderizarPanelGrupos();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            cargarDatosTorneo();
            renderizarPanelGrupos();

            const btnCerrar = document.getElementById("btn-cerrar-fase");
            if (btnCerrar) btnCerrar.addEventListener("click", iniciarCalculoClasificacion);

            const btnReset = document.getElementById("btn-resetear");
            if (btnReset) btnReset.addEventListener("click", resetearTorneo);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Galáctico | Rigelcraft Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Angkor&family=Anton&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-image: url("torneo.png"); /* Usa el fondo que prefieras */
            background-size: cover;
            background-attachment: fixed;
            background-color: #050505;
            font-family: 'Arial', sans-serif;
            padding-bottom: 50px;
            color: #e6edf3;
        }

        hr {
            border: none;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #0184ff, #00ccff, #00ffb3);
            box-shadow: 0 0 10px #00ccff, 0 0 10px #00c3ff;
            margin: 30px 0;
        }

        .breadcrumb {
            text-align: left;
            width: 100%;
            margin: 20px 0 40px 2%;
            font-size: 20px;
            text-shadow: 0 0 4px #000;
        }

        .breadcrumb a { color: #00c3ff; text-decoration: underline; font-weight: bold; transition: 0.3s; text-shadow: 0 0 5px #000; }
        .breadcrumb a:hover { color: #fff; text-shadow: 0 0 10px #00ccff; }
        .breadcrumb span { color: #00c3ff; font-weight: bold; text-decoration: none; }

        .contenedor-mega-titulo {
            text-align: left;
            width: 100%;
            margin: 20px 0 20px 2%;
            max-width: 98%;
        }

        .mega-titulo {
            font-family: 'Angkor', 'Anton', Arial, sans-serif;
            font-size: clamp(40px, 8vw, 130px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            line-height: 1;
            background-image: url('https://static.vecteezy.com/system/resources/previews/006/059/573/non_2x/blue-water-surface-background-waves-of-sea-ocean-pool-and-lake-light-ripple-texture-seamless-pattern-vector.jpg');
            background-size: 400px;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-stroke: 1.5px #003050;
            filter: drop-shadow(0 0 10px #00ccff);
        }

        h3 { font-size: 25px; margin-left: 2%; text-shadow: 0 0 4px #000; }
        p { font-size: 22px; margin-left: 2%; margin-right: 2%; margin-top: 15px; text-shadow: 0 0 4px #000; }

        /* FASE DE GRUPOS - GRID */
        .grid-grupos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 96%;
            margin: 30px auto;
        }

        .tarjeta {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ccff;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 0 12px rgba(0, 204, 255, 0.3);
            transition: transform 0.3s;
        }

        .tarjeta:hover { box-shadow: 0 0 22px rgba(0, 204, 255, 0.6); transform: translateY(-3px); }

        .titulo-tarjeta {
            color: #00fff2;
            font-size: 22px;
            text-align: center;
            border-bottom: 2px solid #00ccff;
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-shadow: 0 0 6px #000;
        }

        .fila-participante {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        /* Medallas */
        .pos-badge { font-size: 13px; font-weight: bold; padding: 3px 7px; border-radius: 6px; min-width: 32px; text-align: center; color: #fff; }
        .pos-1 { background-color: #00c853; box-shadow: 0 0 8px #00c853; }
        .pos-2 { background-color: #00c853; box-shadow: 0 0 8px #00c853; }
        .pos-3 { background-color: #ff9100; box-shadow: 0 0 8px #ff9100; }
        .pos-4 { background-color: #d50000; box-shadow: 0 0 6px #d50000; }

        .info-participante { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00c3ff; object-fit: cover; background-color: #111; }
        .nombre { font-size: 15px; font-weight: bold; text-shadow: 0 0 4px #000; }

        /* Votos Input y Text */
        .input-votos {
            width: 70px; padding: 6px; background: rgba(0,0,0,0.9); border: 1.5px solid #00fff2; 
            border-radius: 6px; color: #ffe600; font-size: 16px; font-weight: bold; text-align: center; outline: none;
        }
        .input-votos:focus { box-shadow: 0 0 10px #ffe600; border-color: #ffe600; }
        .texto-votos { font-size: 18px; font-weight: bold; color: #ffe600; text-shadow: 0 0 5px #ffe600; }

        /* FASE DE LLAVES (BRACKETS) */
        .contenedor-ronda {
            margin: 40px auto;
            width: 96%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed #0051ff;
            border-radius: 12px;
            padding: 20px;
        }
        .titulo-ronda { color: #ffe600; text-align: center; font-size: 30px; text-shadow: 0 0 10px #000; margin-bottom: 20px; }
        .grid-llaves { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .llave-duelo {
            background: linear-gradient(180deg, rgba(0,20,50,0.9) 0%, rgba(0,0,0,0.95) 100%);
            border: 2px solid #00c3ff;
            border-radius: 10px;
            padding: 15px;
            position: relative;
        }
        .vs-badge {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #ff0000; color: #fff; font-weight: bold; font-size: 12px; padding: 4px 8px;
            border-radius: 20px; box-shadow: 0 0 10px #ff0000;
        }

        /* Botones Globales */
        .admin-controls { display: none; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 40px auto; width: 96%; }
        .btn-accion {
            background: linear-gradient(135deg, #00c3ff, #0051ff); color: #fff; font-family: 'Anton', Arial, sans-serif;
            font-size: clamp(16px, 3vw, 22px); padding: 15px 30px; border: 2px solid #00fff2; border-radius: 10px;
            cursor: pointer; box-shadow: 0 0 15px rgba(0, 204, 255, 0.5); transition: 0.3s; letter-spacing: 1px;
        }
        .btn-accion:hover { background: linear-gradient(135deg, #ffe600, #ff8800); color: #000; border-color: #ffe600; transform: scale(1.02); }
        .btn-peligro { background: rgba(213,0,0,0.3); color: #ff5252; border-color: #ff5252; }
        .btn-peligro:hover { background: #d50000; color: #fff; box-shadow: 0 0 15px #d50000; }

        /* Botón Modo Admin Footer */
        .footer-admin { text-align: center; margin-top: 50px; }
        .btn-toggle-admin { background: transparent; border: none; font-size: 24px; cursor: pointer; filter: grayscale(100%); transition: 0.3s; }
        .btn-toggle-admin:hover { filter: grayscale(0%); transform: scale(1.2); }

        /* Responsive */
        @media (max-width: 600px) {
            body { background-position: 50% center !important; }
            .mega-titulo { font-size: clamp(25px, 11vw, 50px) !important; text-align: center !important; margin: 0 auto !important; width: 90%; }
            .breadcrumb { text-align: center; }
            .contenedor-mega-titulo { text-align: center !important; margin-left: 0 !important; width: 100% !important; }
            .grid-grupos, .grid-llaves { grid-template-columns: 1fr; }
            .btn-accion { width: 100%; margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <hr>
    <div class="breadcrumb">
        <a href="index.html">Inicio</a><span> / Torneo Galáctico</span>
    </div>
    
    <div class="contenedor-mega-titulo">
        <h1 class="mega-titulo">TORNEO GALÁCTICO</h1>
    </div>
    <hr>

    <div id="encabezado-fase">
        <h3 id="titulo-estado">Fase de Grupos - Vista Pública</h3>
        <p id="desc-estado">Sigue en vivo la puntuación de cada participante. Las posiciones se actualizan según los resultados.</p>
    </div>
    <hr>

    <!-- Contenedor Principal Dinámico (Grupos o Llaves) -->
    <div id="contenedor-principal"></div>

    <!-- Controles de Administrador (Ocultos por defecto) -->
    <div class="admin-controls" id="panel-admin">
        <button id="btn-cerrar-fase" class="btn-accion">🚀 CERRAR FASE Y AVANZAR</button>
        <button id="btn-resetear" class="btn-accion btn-peligro">⚠️ REINICIAR TORNEO</button>
    </div>

    <hr>
    <div class="breadcrumb">
        <a href="index.html">Inicio</a><span> / Torneo Galáctico</span>
    </div>

    <!-- Footer Switcher Modo Admin -->
    <div class="footer-admin">
        <button class="btn-toggle-admin" onclick="solicitarAccesoAdmin()" title="Modo Administrador">⚙️</button>
    </div>

    <script>
        // CONFIGURACIÓN DE SEGURIDAD
        const PASSWORD_ADMIN = "Rigel2026"; // <-- Cambia aquí la contraseña de Administrador
        let isAdmin = false;

        // FASE 1.1: ESTRUCTURA DE DATOS BASE (21 GRUPOS)
        function generarEstructuraBase() {
            const letras = "ABCDEFGHIJKLMNOPQRSTU".split("");
            const grupos = letras.map(letra => {
                return {
                    id: `grupo_${letra.toLowerCase()}`,
                    nombre: `Grupo ${letra}`,
                    participantes: [
                        { id: `p_${letra}1`, nombre: `Participante 1`, foto: "", votos: 0 },
                        { id: `p_${letra}2`, nombre: `Participante 2`, foto: "", votos: 0 },
                        { id: `p_${letra}3`, nombre: `Participante 3`, foto: "", votos: 0 },
                        { id: `p_${letra}4`, nombre: `Participante 4`, foto: "", votos: 0 }
                    ]
                };
            });
            return {
                faseActual: "grupos", // "grupos" o "llaves"
                rondaLlavesActiva: 0, // 32, 16, 8, 4, 2, 1
                grupos: grupos,
                clasificados32: [],
                llaves: {},
                campeon: null
            };
        }

        let torneoGalactico = {};

        // FASE 4.2: PERSISTENCIA LOCALSTORAGE
        function cargarDatos() {
            const guardado = localStorage.getItem("torneo_galactico_db");
            if (guardado) {
                try { torneoGalactico = JSON.parse(guardado); } 
                catch (e) { torneoGalactico = generarEstructuraBase(); }
            } else {
                torneoGalactico = generarEstructuraBase();
            }
        }

        function guardarDatos() {
            localStorage.setItem("torneo_galactico_db", JSON.stringify(torneoGalactico));
        }

        // CONTROLADOR DE VISTAS (INFOGRAFÍA VS ADMIN)
        function solicitarAccesoAdmin() {
            if (isAdmin) {
                isAdmin = false;
                alert("🔒 Modo Público activado. Controles ocultos.");
            } else {
                const pass = prompt("Acceso Restringido. Ingrese contraseña de Administrador:");
                if (pass === PASSWORD_ADMIN) {
                    isAdmin = true;
                    alert("🔓 Modo Administrador activado. Controles habilitados.");
                } else if (pass !== null) {
                    alert("❌ Contraseña incorrecta.");
                }
            }
            renderizarApp();
        }

        // RENDERIZADOR PRINCIPAL
        function renderizarApp() {
            const panelAdmin = document.getElementById("panel-admin");
            const btnCerrar = document.getElementById("btn-cerrar-fase");
            
            // Lógica de visibilidad del panel admin
            panelAdmin.style.display = isAdmin ? "flex" : "none";

            if (torneoGalactico.faseActual === "grupos") {
                document.getElementById("titulo-estado").innerText = isAdmin ? "Fase de Grupos - MODO ADMINISTRADOR" : "Fase de Grupos - Ranking en Vivo";
                btnCerrar.innerText = "🚀 CERRAR GRUPOS Y CLASIFICAR (Top 32)";
                renderizarGrupos();
            } else {
                if (torneoGalactico.campeon) {
                    document.getElementById("titulo-estado").innerText = "🏆 ¡EL TORNEO HA FINALIZADO!";
                    btnCerrar.style.display = "none";
                } else {
                    document.getElementById("titulo-estado").innerText = isAdmin ? `Fase Final (Ronda de ${torneoGalactico.rondaLlavesActiva}) - ADMIN` : `Cuadro Eliminatorio - Ronda de ${torneoGalactico.rondaLlavesActiva}`;
                    btnCerrar.innerText = "⚔️ CERRAR RONDA Y AVANZAR GANADORES";
                    btnCerrar.style.display = "block";
                }
                renderizarLlaves();
            }
        }

        // FASE 1.2 & 4.1: RENDER DE GRUPOS
        function renderizarGrupos() {
            const contenedor = document.getElementById("contenedor-principal");
            let html = `<div class="grid-grupos">`;

            torneoGalactico.grupos.forEach(grupo => {
                const ordenados = [...grupo.participantes].sort((a, b) => b.votos - a.votos);
                html += `<div class="tarjeta"><h3 class="titulo-tarjeta">${grupo.nombre}</h3>`;

                ordenados.forEach((p, idx) => {
                    const pos = idx + 1;
                    const inputHtml = isAdmin 
                        ? `<input type="number" class="input-votos" min="0" value="${p.votos}" data-tipo="grupo" data-grupo="${grupo.id}" data-pid="${p.id}">`
                        : `<span class="texto-votos">${p.votos} pts</span>`;

                    html += `
                        <div class="fila-participante">
                            <span class="pos-badge pos-${pos}">${pos}º</span>
                            <div class="info-participante">
                                <img src="${p.foto}" alt="${p.nombre}" class="avatar" onerror="this.src='https://via.placeholder.com/38/000000/00fff2?text=P'">
                                <span class="nombre">${p.nombre}</span>
                            </div>
                            ${inputHtml}
                        </div>`;
                });
                html += `</div>`;
            });

            html += `</div>`;
            contenedor.innerHTML = html;
            if (isAdmin) asignarEventosInputs();
        }

        // FASE 3.2 & 4.1: RENDER DE LLAVES (BRACKETS)
        function renderizarLlaves() {
            const contenedor = document.getElementById("contenedor-principal");
            let html = ``;

            if (torneoGalactico.campeon) {
                html += `
                <div class="contenedor-ronda" style="border-color: #ffe600; box-shadow: 0 0 20px #ffe600;">
                    <h2 class="titulo-ronda" style="font-size: 40px;">👑 CAMPEÓN ABSOLUTO 👑</h2>
                    <div style="text-align: center;">
                        <img src="${torneoGalactico.campeon.foto}" class="avatar" style="width: 150px; height: 150px; border-width: 5px; border-color: #ffe600;" onerror="this.src='https://via.placeholder.com/150/000000/ffe600?text=WIN'">
                        <h2 style="color: #fff; margin-top: 15px;">${torneoGalactico.campeon.nombre}</h2>
                    </div>
                </div>`;
            }

            // Mostrar rondas (De la actual hacia atrás)
            const rondasPosibles = [1, 2, 4, 8, 16, 32];
            rondasPosibles.forEach(r => {
                if (torneoGalactico.llaves[`ronda${r}`]) {
                    const nombreRonda = r === 2 ? "GRAN FINAL" : r === 4 ? "SEMIFINALES" : r === 8 ? "CUARTOS DE FINAL" : r === 16 ? "OCTAVOS DE FINAL" : "DIECISEISAVOS DE FINAL";
                    const isActiva = (torneoGalactico.rondaLlavesActiva === r && !torneoGalactico.campeon);
                    const opacity = isActiva ? "1" : "0.5"; // Rondas pasadas se ven atenuadas

                    html += `
                    <div class="contenedor-ronda" style="opacity: ${opacity};">
                        <h2 class="titulo-ronda">${nombreRonda} ${isActiva ? "(ACTIVA)" : "(FINALIZADA)"}</h2>
                        <div class="grid-llaves">`;
                    
                    torneoGalactico.llaves[`ronda${r}`].forEach(llave => {
                        const htmlVotosP1 = (isAdmin && isActiva) 
                            ? `<input type="number" class="input-votos" value="${llave.votosP1}" data-tipo="llave" data-ronda="${r}" data-llave="${llave.id}" data-target="votosP1">`
                            : `<span class="texto-votos">${llave.votosP1}</span>`;
                            
                        const htmlVotosP2 = (isAdmin && isActiva) 
                            ? `<input type="number" class="input-votos" value="${llave.votosP2}" data-tipo="llave" data-ronda="${r}" data-llave="${llave.id}" data-target="votosP2">`
                            : `<span class="texto-votos">${llave.votosP2}</span>`;

                        // Colores si ya hay ganador
                        const colorP1 = llave.ganador && llave.ganador.id === llave.p1.id ? "#00ff22" : "#fff";
                        const colorP2 = llave.ganador && llave.ganador.id === llave.p2.id ? "#00ff22" : "#fff";

                        html += `
                            <div class="llave-duelo">
                                <div class="vs-badge">VS</div>
                                <!-- Jugador 1 -->
                                <div class="fila-participante" style="margin-bottom: 25px;">
                                    <div class="info-participante">
                                        <img src="${llave.p1.foto}" class="avatar" onerror="this.src='https://via.placeholder.com/38/000000/00fff2?text=P1'">
                                        <span class="nombre" style="color: ${colorP1}">${llave.p1.nombre}</span>
                                    </div>
                                    ${htmlVotosP1}
                                </div>
                                <!-- Jugador 2 -->
                                <div class="fila-participante" style="margin-bottom: 0;">
                                    <div class="info-participante">
                                        <img src="${llave.p2.foto}" class="avatar" onerror="this.src='https://via.placeholder.com/38/000000/00fff2?text=P2'">
                                        <span class="nombre" style="color: ${colorP2}">${llave.p2.nombre}</span>
                                    </div>
                                    ${htmlVotosP2}
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }
            });
            contenedor.innerHTML = html;
            if (isAdmin) asignarEventosInputs();
        }

        // EVENTOS DE ENTRADA DINÁMICA
        function asignarEventosInputs() {
            document.querySelectorAll(".input-votos").forEach(input => {
                input.addEventListener("change", (e) => {
                    let val = parseInt(e.target.value) || 0;
                    if (val < 0) val = 0;
                    e.target.value = val;

                    const tipo = e.target.getAttribute("data-tipo");
                    if (tipo === "grupo") {
                        const gId = e.target.getAttribute("data-grupo");
                        const pId = e.target.getAttribute("data-pid");
                        const grupo = torneoGalactico.grupos.find(g => g.id === gId);
                        const part = grupo.participantes.find(p => p.id === pId);
                        part.votos = val;
                        guardarDatos();
                        renderizarGrupos(); // Auto reorden
                    } else if (tipo === "llave") {
                        const r = e.target.getAttribute("data-ronda");
                        const lId = e.target.getAttribute("data-llave");
                        const target = e.target.getAttribute("data-target"); // votosP1 o votosP2
                        const llave = torneoGalactico.llaves[`ronda${r}`].find(l => l.id === lId);
                        llave[target] = val;
                        guardarDatos();
                    }
                });
            });
        }

        // FASE 2 Y 3: LÓGICA DE AVANCE Y CÁLCULO
        function botonPrincipalAccion() {
            if (torneoGalactico.faseActual === "grupos") {
                cerrarFaseGrupos();
            } else {
                avanzarRondaLlaves();
            }
        }

        function cerrarFaseGrupos() {
            // Fase 2.1: Validado automáticamente en input events.
            // Fase 2.2: Clasificados Directos (21 Primeros)
            let directos = [];
            let todosLosSegundos = [];

            torneoGalactico.grupos.forEach(grupo => {
                const ord = [...grupo.participantes].sort((a, b) => b.votos - a.votos);
                directos.push(ord[0]);
                if (ord.length > 1) todosLosSegundos.push(ord[1]);
            });

            // Fase 2.3: 11 Mejores segundos
            todosLosSegundos.sort((a, b) => b.votos - a.votos);
            const mejoresSegundos = todosLosSegundos.slice(0, 11);

            // Fase 2.4: Fusión 32 Finalistas
            const finalistas = [...directos, ...mejoresSegundos];
            if (finalistas.length !== 32) return alert("Error: No se lograron 32 finalistas.");

            if (confirm("🌌 FASE DE GRUPOS CONCLUIDA.\n\nSe seleccionaron 21 líderes y 11 mejores segundos.\n¿Generar llaves eliminatorias?")) {
                torneoGalactico.clasificados32 = finalistas;
                torneoGalactico.faseActual = "llaves";
                generarPrimeraRondaLlaves(finalistas);
            }
        }

        // FASE 3.1: MEZCLA Y EMPAREJAMIENTO DE LLAVES
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generarPrimeraRondaLlaves(lista32) {
            const mezclados = shuffle(lista32); // Fisher-Yates Random
            const llaves32 = [];
            for (let i = 0; i < 32; i += 2) {
                llaves32.push({
                    id: `L32-${i/2}`, p1: mezclados[i], p2: mezclados[i+1], votosP1: 0, votosP2: 0, ganador: null
                });
            }
            torneoGalactico.llaves["ronda32"] = llaves32;
            torneoGalactico.rondaLlavesActiva = 32;
            guardarDatos();
            renderizarApp();
        }

        // FASE 3.3: AVANCE DINÁMICO DE RONDAS
        function avanzarRondaLlaves() {
            const rActiva = torneoGalactico.rondaLlavesActiva;
            const duelos = torneoGalactico.llaves[`ronda${rActiva}`];

            // Validar empates
            for (let duelo of duelos) {
                if (duelo.votosP1 === duelo.votosP2) {
                    alert(`⚠️ EMPATE DETECTADO en el duelo de ${duelo.p1.nombre} vs ${duelo.p2.nombre}.\nDebes romper el empate antes de avanzar.`);
                    return;
                }
            }

            if (!confirm(`¿Confirmar cierre de la Ronda de ${rActiva} y avanzar a los ganadores?`)) return;

            const ganadores = duelos.map(d => {
                d.ganador = d.votosP1 > d.votosP2 ? d.p1 : d.p2;
                return d.ganador;
            });

            const sigRondaNum = rActiva / 2;

            if (sigRondaNum < 1) {
                // Hay Campeón
                torneoGalactico.campeon = ganadores[0];
                torneoGalactico.rondaLlavesActiva = 0;
            } else {
                // Crear siguiente bracket
                const nuevasLlaves = [];
                for (let i = 0; i < ganadores.length; i += 2) {
                    nuevasLlaves.push({
                        id: `L${sigRondaNum}-${i/2}`, p1: ganadores[i], p2: ganadores[i+1], votosP1: 0, votosP2: 0, ganador: null
                    });
                }
                torneoGalactico.llaves[`ronda${sigRondaNum}`] = nuevasLlaves;
                torneoGalactico.rondaLlavesActiva = sigRondaNum;
            }

            guardarDatos();
            renderizarApp();
        }

        // FASE 4.2: REINICIAR SISTEMA
        function resetearTorneo() {
            if (confirm("⚠️ ¡ADVERTENCIA CRÍTICA!\n¿Estás absolutamente seguro de querer borrar todos los datos del torneo? Esto volverá todos los votos a 0 y regresará a la Fase de Grupos.")) {
                localStorage.removeItem("torneo_galactico_db");
                cargarDatos();
                renderizarApp();
                alert("Torneo reiniciado con éxito.");
            }
        }

        // INICIALIZACIÓN
        document.addEventListener("DOMContentLoaded", () => {
            cargarDatos();
            renderizarApp();

            document.getElementById("btn-cerrar-fase").addEventListener("click", botonPrincipalAccion);
            document.getElementById("btn-resetear").addEventListener("click", resetearTorneo);
        });

    </script>
</body>
</html>

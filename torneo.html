                console.log("⚡ Datos sincronizados en la nube de Firebase");
            }).catch((err) => {
                console.error("Error al guardar en Firebase: ", err);
            });
        }

        function solicitarAccesoAdmin() {
            if (isAdmin) {
                isAdmin = false;
                alert("🔒 Modo Público activado. Controles ocultos.");
            } else {
                const pass = prompt("Acceso Restringido. Ingrese contraseña de Administrador:");
                if (pass === PASSWORD_ADMIN) {
                    isAdmin = true;
                    alert("🔓 Modo Administrador activado. Puedes editar votos y representantes.");
                } else if (pass !== null) {
                    alert("❌ Contraseña incorrecta.");
                }
            }
            renderizarApp();
        }

        function cambiarModoVista(modo) {
            modoVista = modo;
            document.getElementById("btn-modo-grupos").classList.toggle("activo", modo === 'grupos');
            document.getElementById("btn-modo-lista").classList.toggle("activo", modo === 'lista');
            renderizarApp();
        }

        function renderizarApp() {
            const panelAdmin = document.getElementById("panel-admin");
            const btnCerrar = document.getElementById("btn-cerrar-fase");
            const selectorVistas = document.getElementById("selector-vistas");
            
            panelAdmin.style.display = isAdmin ? "flex" : "none";

            if (torneoGalactico.faseActual === "grupos") {
                selectorVistas.style.display = "flex";
                document.getElementById("titulo-estado").innerText = isAdmin ? "Fase de Grupos - MODO ADMINISTRADOR" : "Fase de Grupos - Ranking en Vivo";
                document.getElementById("desc-estado").innerText = "Sigue en vivo la puntuación de cada participante. Los datos se actualizan automáticamente desde la nube.";
                btnCerrar.innerText = "🚀 CERRAR GRUPOS Y CLASIFICAR (Top 32)";

                if (modoVista === "grupos") {
                    renderizarGrupos();
                } else {
                    renderizarListaGlobal84();
                }
            } else {
                selectorVistas.style.display = "none";
                if (torneoGalactico.campeon) {
                    document.getElementById("titulo-estado").innerText = "🏆 ¡EL TORNEO HA FINALIZADO!";
                    btnCerrar.style.display = "none";
                } else {
                    document.getElementById("titulo-estado").innerText = isAdmin ? `Fase Final (Ronda de ${torneoGalactico.rondaLlavesActiva}) - ADMIN` : `Cuadro Eliminatorio - Ronda de ${torneoGalactico.rondaLlavesActiva}`;
                    btnCerrar.innerText = "⚔️ CERRAR RONDA Y AVANZAR GANADORES";
                    btnCerrar.style.display = "block";
                }
                renderizarLlaves();
            }
        }

        function getRepHtml(p, gId) {
            if (isAdmin) {
                return `<input type="text" class="input-rep" value="${p.representante || ''}" placeholder="Rep: @Usuario" data-grupo="${gId}" data-pid="${p.id}">`;
            } else {
                return p.representante ? `<span class="rep-tag">🛡️ Rep: ${p.representante}</span>` : '';
            }
        }

        function renderizarGrupos() {
            const contenedor = document.getElementById("contenedor-principal");
            let html = `<div class="grid-grupos">`;

            torneoGalactico.grupos.forEach(grupo => {
                const ordenados = [...grupo.participantes].sort((a, b) => b.votos - a.votos);
                html += `<div class="tarjeta"><h3 class="titulo-tarjeta">${grupo.nombre}</h3>`;

                ordenados.forEach((p, idx) => {
                    const pos = idx + 1;
                    const inputHtml = isAdmin 
                        ? `<input type="number" class="input-votos" min="0" value="${p.votos}" data-tipo="grupo" data-grupo="${grupo.id}" data-pid="${p.id}">`
                        : `<span class="texto-votos">${p.votos} pts</span>`;
                    
                    const repHtml = getRepHtml(p, grupo.id);

                    html += `
                        <div class="fila-participante">
                            <span class="pos-badge pos-${pos}">${pos}º</span>
                            <div class="info-participante">
                                <div class="nombre-contenedor">
                                    <span class="nombre">${p.nombre}</span>
                                    ${repHtml}
                                </div>
                            </div>
                            ${inputHtml}
                        </div>`;
                });
                html += `</div>`;
            });

            html += `</div>`;
            contenedor.innerHTML = html;
            if (isAdmin) {
                asignarEventosInputsVotos();
                asignarEventosInputsReps();
            }
        }

        function renderizarListaGlobal84() {
            const contenedor = document.getElementById("contenedor-principal");
            
            let listaTodos = [];
            torneoGalactico.grupos.forEach(grupo => {
                grupo.participantes.forEach(p => {
                    listaTodos.push({ ...p, grupoNombre: grupo.nombre, grupoId: grupo.id });
                });
            });

            listaTodos.sort((a, b) => b.votos - a.votos);

            let html = `
            <div class="contenedor-lista-global">
                <h3 class="titulo-tarjeta" style="font-size: 26px; margin-bottom: 20px;">RANKING GENERAL - 84 COMPETIDORES</h3>
            `;

            listaTodos.forEach((p, idx) => {
                const pos = idx + 1;
                let claseBadge = "pos-resto";
                if (pos <= 21) claseBadge = "pos-top21";
                else if (pos <= 32) claseBadge = "pos-top32";

                const inputHtml = isAdmin 
                    ? `<input type="number" class="input-votos" min="0" value="${p.votos}" data-tipo="grupo" data-grupo="${p.grupoId}" data-pid="${p.id}">`
                    : `<span class="texto-votos">${p.votos} pts</span>`;
                
                const repHtml = getRepHtml(p, p.grupoId);

                html += `
                    <div class="fila-participante">
                        <span class="pos-badge ${claseBadge}">${pos}º</span>
                        <div class="info-participante">
                            <div class="nombre-contenedor">
                                <div style="display:flex; align-items:center; flex-wrap: wrap;">
                                    <span class="nombre">${p.nombre}</span>
                                    <span class="tag-grupo">(${p.grupoNombre})</span>
                                </div>
                                ${repHtml}
                            </div>
                        </div>
                        ${inputHtml}
                    </div>`;
            });

            html += `</div>`;
            contenedor.innerHTML = html;
            if (isAdmin) {
                asignarEventosInputsVotos();
                asignarEventosInputsReps();
            }
        }

        function renderizarLlaves() {
            const contenedor = document.getElementById("contenedor-principal");
            let html = ``;

            if (torneoGalactico.campeon) {
                html += `
                <div class="contenedor-ronda" style="border-color: #ffe600; box-shadow: 0 0 20px #ffe600;">
                    <h2 class="titulo-ronda" style="font-size: 40px;">👑 CAMPEÓN ABSOLUTO 👑</h2>
                    <div style="text-align: center;">
                        <h2 style="color: #fff; margin-top: 15px; font-size: 40px;">${torneoGalactico.campeon.nombre}</h2>
                        ${torneoGalactico.campeon.representante ? `<div class="rep-tag" style="font-size:22px; margin-top:10px;">🛡️ Rep: ${torneoGalactico.campeon.representante}</div>` : ''}
                    </div>
                </div>`;
            }

            const rondasPosibles = [1, 2, 4, 8, 16, 32];
            rondasPosibles.forEach(r => {
                if (torneoGalactico.llaves[`ronda${r}`]) {
                    const nombreRonda = r === 2 ? "GRAN FINAL" : r === 4 ? "SEMIFINALES" : r === 8 ? "CUARTOS DE FINAL" : r === 16 ? "OCTAVOS DE FINAL" : "DIECISEISAVOS DE FINAL";
                    const isActiva = (torneoGalactico.rondaLlavesActiva === r && !torneoGalactico.campeon);
                    const opacity = isActiva ? "1" : "0.5";

                    html += `
                    <div class="contenedor-ronda" style="opacity: ${opacity};">
                        <h2 class="titulo-ronda">${nombreRonda} ${isActiva ? "(ACTIVA)" : "(FINALIZADA)"}</h2>
                        <div class="grid-llaves">`;
                    
                    torneoGalactico.llaves[`ronda${r}`].forEach(llave => {
                        const htmlVotosP1 = (isAdmin && isActiva) 
                            ? `<input type="number" class="input-votos" value="${llave.votosP1}" data-tipo="llave" data-ronda="${r}" data-llave="${llave.id}" data-target="votosP1">`
                            : `<span class="texto-votos">${llave.votosP1}</span>`;
                            
                        const htmlVotosP2 = (isAdmin && isActiva) 
                            ? `<input type="number" class="input-votos" value="${llave.votosP2}" data-tipo="llave" data-ronda="${r}" data-llave="${llave.id}" data-target="votosP2">`
                            : `<span class="texto-votos">${llave.votosP2}</span>`;

                        const colorP1 = llave.ganador && llave.ganador.id === llave.p1.id ? "#00ff22" : "#fff";
                        const colorP2 = llave.ganador && llave.ganador.id === llave.p2.id ? "#00ff22" : "#fff";

                        const repP1 = llave.p1.representante ? `<span class="rep-tag">🛡️ Rep: ${llave.p1.representante}</span>` : '';
                        const repP2 = llave.p2.representante ? `<span class="rep-tag">🛡️ Rep: ${llave.p2.representante}</span>` : '';

                        html += `
                            <div class="llave-duelo">
                                <div class="vs-badge">VS</div>
                                <div class="fila-participante" style="margin-bottom: 25px;">
                                    <div class="info-participante">
                                        <div class="nombre-contenedor">
                                            <span class="nombre" style="color: ${colorP1}">${llave.p1.nombre}</span>
                                            ${repP1}
                                        </div>
                                    </div>
                                    ${htmlVotosP1}
                                </div>
                                <div class="fila-participante" style="margin-bottom: 0;">
                                    <div class="info-participante">
                                        <div class="nombre-contenedor">
                                            <span class="nombre" style="color: ${colorP2}">${llave.p2.nombre}</span>
                                            ${repP2}
                                        </div>
                                    </div>
                                    ${htmlVotosP2}
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }
            });
            contenedor.innerHTML = html;
            if (isAdmin) asignarEventosInputsVotos();
        }

        function asignarEventosInputsVotos() {
            document.querySelectorAll(".input-votos").forEach(input => {
                input.addEventListener("change", (e) => {
                    let val = parseInt(e.target.value) || 0;
                    if (val < 0) val = 0;
                    e.target.value = val;

                    const tipo = e.target.getAttribute("data-tipo");
                    if (tipo === "grupo") {
                        const gId = e.target.getAttribute("data-grupo");
                        const pId = e.target.getAttribute("data-pid");
                        const grupo = torneoGalactico.grupos.find(g => g.id === gId);
                        const part = grupo.participantes.find(p => p.id === pId);
                        part.votos = val;
                        guardarDatosEnNube();
                    } else if (tipo === "llave") {
                        const r = e.target.getAttribute("data-ronda");
                        const lId = e.target.getAttribute("data-llave");
                        const target = e.target.getAttribute("data-target");
                        const llave = torneoGalactico.llaves[`ronda${r}`].find(l => l.id === lId);
                        llave[target] = val;
                        guardarDatosEnNube();
                    }
                });
            });
        }

        function asignarEventosInputsReps() {
            document.querySelectorAll(".input-rep").forEach(input => {
                input.addEventListener("change", (e) => {
                    const gId = e.target.getAttribute("data-grupo");
                    const pId = e.target.getAttribute("data-pid");
                    const grupo = torneoGalactico.grupos.find(g => g.id === gId);
                    if (grupo) {
                        const part = grupo.participantes.find(p => p.id === pId);
                        if (part) {
                            part.representante = e.target.value;
                            guardarDatosEnNube();
                        }
                    }
                });
            });
        }

        function botonPrincipalAccion() {
            if (torneoGalactico.faseActual === "grupos") {
                cerrarFaseGrupos();
            } else {
                avanzarRondaLlaves();
            }
        }

        function cerrarFaseGrupos() {
            let directos = [];
            let todosLosSegundos = [];

            torneoGalactico.grupos.forEach(grupo => {
                const ord = [...grupo.participantes].sort((a, b) => b.votos - a.votos);
                directos.push(ord[0]);
                if (ord.length > 1) todosLosSegundos.push(ord[1]);
            });

            todosLosSegundos.sort((a, b) => b.votos - a.votos);
            const mejoresSegundos = todosLosSegundos.slice(0, 11);

            const finalistas = [...directos, ...mejoresSegundos];
            if (finalistas.length !== 32) return alert("Error: No se lograron 32 finalistas.");

            if (confirm("🌌 FASE DE GRUPOS CONCLUIDA.\n\nSe seleccionaron 21 líderes y 11 mejores segundos.\n¿Generar llaves eliminatorias?")) {
                torneoGalactico.clasificados32 = finalistas;
                torneoGalactico.faseActual = "llaves";
                generarPrimeraRondaLlaves(finalistas);
            }
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generarPrimeraRondaLlaves(lista32) {
            const mezclados = shuffle(lista32);
            const llaves32 = [];
            for (let i = 0; i < 32; i += 2) {
                llaves32.push({
                    id: `L32-${i/2}`, p1: mezclados[i], p2: mezclados[i+1], votosP1: 0, votosP2: 0, ganador: null
                });
            }
            torneoGalactico.llaves["ronda32"] = llaves32;
            torneoGalactico.rondaLlavesActiva = 32;
            guardarDatosEnNube();
        }

        function avanzarRondaLlaves() {
            const rActiva = torneoGalactico.rondaLlavesActiva;
            const duelos = torneoGalactico.llaves[`ronda${rActiva}`];

            for (let duelo of duelos) {
                if (duelo.votosP1 === duelo.votosP2) {
                    alert(`⚠️ EMPATE DETECTADO en el duelo de ${duelo.p1.nombre} vs ${duelo.p2.nombre}.\nDebes romper el empate antes de avanzar.`);
                    return;
                }
            }

            if (!confirm(`¿Confirmar cierre de la Ronda de ${rActiva} y avanzar a los ganadores?`)) return;

            const ganadores = duelos.map(d => {
                d.ganador = d.votosP1 > d.votosP2 ? d.p1 : d.p2;
                return d.ganador;
            });

            const sigRondaNum = rActiva / 2;

            if (sigRondaNum < 1) {
                torneoGalactico.campeon = ganadores[0];
                torneoGalactico.rondaLlavesActiva = 0;
            } else {
                const nuevasLlaves = [];
                for (let i = 0; i < ganadores.length; i += 2) {
                    nuevasLlaves.push({
                        id: `L${sigRondaNum}-${i/2}`, p1: ganadores[i], p2: ganadores[i+1], votosP1: 0, votosP2: 0, ganador: null
                    });
                }
                torneoGalactico.llaves[`ronda${sigRondaNum}`] = nuevasLlaves;
                torneoGalactico.rondaLlavesActiva = sigRondaNum;
            }

            guardarDatosEnNube();
        }

        function resetearTorneo() {
            if (confirm("⚠️ ¡ADVERTENCIA CRÍTICA!\n¿Estás absolutamente seguro de querer borrar todos los datos del torneo en la NUBE? Se borrarán todos los votos y se reiniciará la Fase de Grupos.")) {
                torneoGalactico = generarEstructuraBase();
                guardarDatosEnNube();
                alert("Torneo reiniciado exitosamente en la Nube 🚀.");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            inicializarFirebaseListener();

            document.getElementById("btn-cerrar-fase").addEventListener("click", botonPrincipalAccion);
            document.getElementById("btn-resetear").addEventListener("click", resetearTorneo);
        });
    </script>
</body>
</html>

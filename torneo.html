    <script>

        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const docRef = db.collection("torneo_galactico").doc("estado_oficial");

        let isAdmin = false;
        let modoVista = "grupos";
        let torneoGalactico = {};

        auth.onAuthStateChanged((user) => {
            if (user) { isAdmin = true; document.getElementById("btn-admin-icon").style.filter = "grayscale(0%)"; } 
            else { isAdmin = false; document.getElementById("btn-admin-icon").style.filter = "grayscale(100%)"; }
            if (Object.keys(torneoGalactico).length > 0) renderizarApp();
        });

        function solicitarAccesoAdmin() {
            if (isAdmin) {
                auth.signOut().then(() => alert("🔒 Sesión cerrada. Modo Público activo."));
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider)
                    .then((result) => alert(`🔓 Bienvenido, ${result.user.displayName}. Modo Administrador activo.`))
                    .catch((error) => alert("❌ Error de inicio de sesión con Google."));
            }
        }

        function inicializarFirebaseListener() {
            docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    torneoGalactico = doc.data();
                } else {
                    torneoGalactico = generarEstructuraBase();
                    guardarDatosEnNube();
                }
                renderizarApp();
            }, (error) => console.error("Error al conectar con Firestore: ", error));
        }

        function guardarDatosEnNube() {
            docRef.set(torneoGalactico).then(() => console.log("⚡ Datos guardados en Firestore")).catch((err) => alert("⚠️ Sin permisos de guardado."));
        }

        function cambiarModoVista(modo) {
            modoVista = modo;
            document.getElementById("btn-modo-grupos").classList.toggle("activo", modo === 'grupos');
            document.getElementById("btn-modo-lista").classList.toggle("activo", modo === 'lista');
            renderizarApp();
        }

        /* ----------------------------------------------------
           LÓGICA MATEMÁTICA: PUNTOS TOTALES Y ESTADOS
        ---------------------------------------------------- */
        function calcularEstadisticasGlobales(torneo) {
            let stats = {};
            
            // 1. Sumar Fase de Grupos
            torneo.grupos.forEach(g => {
                let totalG = g.participantes.reduce((sum, p) => sum + p.votos, 0);
                g.participantes.forEach(p => {
                    let pts = totalG > 0 ? Math.round((p.votos / totalG) * 1000) : 0;
                    stats[p.id] = { 
                        ...p, grupoNombre: g.nombre, puntosTotales: pts,
                        estado: torneo.faseActual === "grupos" ? "En competencia (Grupos)" : "Eliminado en Fase de Grupos"
                    };
                });
            });

            // 2. Sumar Fases Eliminatorias si ya cerraron los grupos
            if (torneo.faseActual === "llaves") {
                torneo.clasificados32.forEach(p => { if(stats[p.id]) stats[p.id].estado = "En competencia (16avos)"; });

                const rondas = [32, 16, 8, 4, 2];
                let perdedoresSemis = [];
                
                rondas.forEach(r => {
                    if (torneo.llaves[`ronda${r}`]) {
                        torneo.llaves[`ronda${r}`].forEach(d => {
                            let totalD = d.votosP1 + d.votosP2;
                            let ptsP1 = totalD > 0 ? Math.round((d.votosP1 / totalD) * 1000) : 0;
                            let ptsP2 = totalD > 0 ? Math.round((d.votosP2 / totalD) * 1000) : 0;
                            
                            if (stats[d.p1.id]) stats[d.p1.id].puntosTotales += ptsP1;
                            if (stats[d.p2.id]) stats[d.p2.id].puntosTotales += ptsP2;

                            if (d.ganador) {
                                let perdedorId = d.ganador.id === d.p1.id ? d.p2.id : d.p1.id;
                                let ganadorId = d.ganador.id;
                                
                                if (r === 32) stats[perdedorId].estado = "Eliminado en 16avos";
                                else if (r === 16) stats[perdedorId].estado = "Eliminado en Octavos";
                                else if (r === 8) stats[perdedorId].estado = "Eliminado en Cuartos";
                                else if (r === 4) perdedoresSemis.push(stats[perdedorId]);
                                else if (r === 2) {
                                    stats[perdedorId].estado = "🥈 2.º Lugar (Subcampeón)";
                                    stats[ganadorId].estado = "👑 CAMPEÓN ABSOLUTO";
                                }

                                if (r > 2) {
                                    let nomSig = r===32 ? "Octavos" : r===16 ? "Cuartos" : r===8 ? "Semifinales" : "Final";
                                    stats[ganadorId].estado = `En competencia (${nomSig})`;
                                }
                            } else {
                                let nomAct = r===32 ? "16avos" : r===16 ? "Octavos" : r===8 ? "Cuartos" : r===4 ? "Semifinales" : "Final";
                                if(stats[d.p1.id]) stats[d.p1.id].estado = `En competencia (${nomAct})`;
                                if(stats[d.p2.id]) stats[d.p2.id].estado = `En competencia (${nomAct})`;
                            }
                        });
                    }
                });

                // Determinar 3.er y 4.º lugar por puntos acumulados
                if (perdedoresSemis.length === 2) {
                    perdedoresSemis.sort((a,b) => b.puntosTotales - a.puntosTotales);
                    perdedoresSemis[0].estado = "🥉 3.er Lugar";
                    perdedoresSemis[1].estado = "Eliminado en Semifinales (4.º Lugar)";
                }
            }
            return stats;
        }

        /* ----------------------------------------------------
           RENDERIZADO Y ESTRUCTURA DE LA PÁGINA
        ---------------------------------------------------- */
        function renderizarApp() {
            const panelAdmin = document.getElementById("panel-admin");
            const btnCerrar = document.getElementById("btn-cerrar-fase");
            
            panelAdmin.style.display = isAdmin ? "flex" : "none";

            if (torneoGalactico.faseActual === "grupos") {
                document.getElementById("titulo-estado").innerText = isAdmin ? "Fase de Grupos - ADMIN" : "Fase de Grupos - En Vivo";
                btnCerrar.innerText = "🚀 CERRAR GRUPOS Y CLASIFICAR (Top 32)";
                btnCerrar.style.display = "block";
            } else {
                if (torneoGalactico.campeon) {
                    document.getElementById("titulo-estado").innerText = "🏆 ¡EL TORNEO HA FINALIZADO!";
                    btnCerrar.style.display = "none";
                } else {
                    document.getElementById("titulo-estado").innerText = isAdmin ? `Fase Final (Ronda de ${torneoGalactico.rondaLlavesActiva}) - ADMIN` : `Cuadro Eliminatorio - Ronda de ${torneoGalactico.rondaLlavesActiva}`;
                    btnCerrar.innerText = "⚔️ CERRAR RONDA Y AVANZAR GANADORES";
                    btnCerrar.style.display = "block";
                }
            }

            if (modoVista === "grupos") renderizarHistorialFases();
            else renderizarListaGlobal76();
        }

        function getClaseEstado(estadoStr) {
            if (estadoStr.includes("En competencia")) return "estado-competencia";
            if (estadoStr.includes("Lugar") || estadoStr.includes("CAMPEÓN")) return "estado-podio";
            return "estado-eliminado";
        }

        function getRepHtml(p) {
            if (isAdmin) return `<input type="text" class="input-rep" value="${p.representante || ''}" placeholder="Rep: @Usuario" data-grupo="${p.grupoId || ''}" data-pid="${p.id}">`;
            return p.representante ? `<span class="rep-tag">🛡️ Rep: ${p.representante}</span>` : '';
        }

        // VISTA HISTORIAL
        function renderizarHistorialFases() {
            const contenedor = document.getElementById("contenedor-principal");
            let html = ``;

            // 1. Campeón
            if (torneoGalactico.campeon) {
                html += `
                <div class="contenedor-ronda" style="border-color: #ffe600; box-shadow: 0 0 20px #ffe600;">
                    <h2 class="titulo-ronda" style="font-size: 40px;">👑 CAMPEÓN ABSOLUTO 👑</h2>
                    <div style="text-align: center;">
                        <h2 style="color: #fff; margin-top: 15px; font-size: 40px;">${torneoGalactico.campeon.nombre}</h2>
                    </div>
                </div>`;
            }

            // 2. Llaves Eliminatorias (De la Final hacia los 16avos)
            const rondas = [2, 4, 8, 16, 32];
            rondas.forEach(r => {
                if (torneoGalactico.llaves[`ronda${r}`]) {
                    const isActiva = (torneoGalactico.rondaLlavesActiva === r && !torneoGalactico.campeon);
                    const nombreRonda = r === 2 ? "GRAN FINAL" : r === 4 ? "SEMIFINALES" : r === 8 ? "CUARTOS DE FINAL" : r === 16 ? "OCTAVOS DE FINAL" : "DIECISEISAVOS DE FINAL";
                    
                    html += `
                    <div class="contenedor-ronda" style="opacity: ${isActiva ? '1' : '0.6'};">
                        <h2 class="titulo-ronda">${nombreRonda} ${isActiva ? "(ACTIVA)" : "(FINALIZADA)"}</h2>
                        <div class="grid-llaves">`;
                    
                    torneoGalactico.llaves[`ronda${r}`].forEach(llave => {
                        let totalDuelo = llave.votosP1 + llave.votosP2;
                        let pts1 = totalDuelo > 0 ? Math.round((llave.votosP1 / totalDuelo)*1000) : 0;
                        let pts2 = totalDuelo > 0 ? Math.round((llave.votosP2 / totalDuelo)*1000) : 0;
                        
                        const colorP1 = llave.ganador && llave.ganador.id === llave.p1.id ? "#00ff22" : "#fff";
                        const colorP2 = llave.ganador && llave.ganador.id === llave.p2.id ? "#00ff22" : "#fff";

                        const cajaVotosP1 = isAdmin && isActiva 
                            ? `<div class="caja-votos"><input type="number" class="input-votos" value="${llave.votosP1}" data-tipo="llave" data-ronda="${r}" data-llave="${llave.id}" data-target="votosP1"><span class="preview-puntos">${pts1} pts</span></div>`
                            : `<div class="caja-votos"><span class="preview-puntos">${pts1} pts</span><span class="texto-votos-reales">(${llave.votosP1} votos)</span></div>`;

                        const cajaVotosP2 = isAdmin && isActiva 
                            ? `<div class="caja-votos"><input type="number" class="input-votos" value="${llave.votosP2}" data-tipo="llave" data-ronda="${r}" data-llave="${llave.id}" data-target="votosP2"><span class="preview-puntos">${pts2} pts</span></div>`
                            : `<div class="caja-votos"><span class="preview-puntos">${pts2} pts</span><span class="texto-votos-reales">(${llave.votosP2} votos)</span></div>`;

                        html += `
                            <div class="llave-duelo">
                                <div class="vs-badge">VS</div>
                                <div class="fila-participante" style="margin-bottom: 25px;">
                                    <div class="info-participante"><span class="nombre" style="color: ${colorP1}">${llave.p1.nombre}</span></div>
                                    ${cajaVotosP1}
                                </div>
                                <div class="fila-participante" style="margin-bottom: 0;">
                                    <div class="info-participante"><span class="nombre" style="color: ${colorP2}">${llave.p2.nombre}</span></div>
                                    ${cajaVotosP2}
                                </div>
                            </div>`;
                    });
                    html += `</div></div>`;
                }
            });

            // 3. Fase de Grupos
            const isGruposActiva = torneoGalactico.faseActual === "grupos";
            html += `<div class="contenedor-ronda" style="opacity: ${isGruposActiva ? '1' : '0.6'}; border-color: #00ffb3;">
                     <h2 class="titulo-ronda">FASE DE GRUPOS ${isGruposActiva ? "(ACTIVA)" : "(FINALIZADA)"}</h2><div class="grid-grupos">`;

            torneoGalactico.grupos.forEach(grupo => {
                let totalG = grupo.participantes.reduce((sum, p) => sum + p.votos, 0);
                
                let ord = grupo.participantes.map(p => ({ ...p, pts: totalG > 0 ? Math.round((p.votos/totalG)*1000) : 0 }))
                                             .sort((a,b) => b.pts - a.pts);

                html += `<div class="tarjeta"><h3 class="titulo-tarjeta">${grupo.nombre}</h3>`;
                ord.forEach((p, idx) => {
                    const cajaVotos = (isAdmin && isGruposActiva)
                        ? `<div class="caja-votos"><input type="number" class="input-votos" value="${p.votos}" data-tipo="grupo" data-grupo="${grupo.id}" data-pid="${p.id}"><span class="preview-puntos">${p.pts} pts</span></div>`
                        : `<div class="caja-votos"><span class="preview-puntos">${p.pts} pts</span><span class="texto-votos-reales">(${p.votos} votos)</span></div>`;
                    
                    html += `
                        <div class="fila-participante">
                            <span class="pos-badge pos-${idx+1}">${idx+1}º</span>
                            <div class="info-participante">
                                <div class="nombre-contenedor">
                                    <span class="nombre">${p.nombre}</span>
                                    ${getRepHtml({...p, grupoId: grupo.id})}
                                </div>
                            </div>
                            ${cajaVotos}
                        </div>`;
                });
                html += `</div>`;
            });

            html += `</div></div>`;
            contenedor.innerHTML = html;
            if (isAdmin) { asignarEventosInputsVotos(); asignarEventosInputsReps(); }
        }

        // VISTA LISTA GLOBAL: 76 participantes
        function renderizarListaGlobal76() {
            const contenedor = document.getElementById("contenedor-principal");
            const stats = calcularEstadisticasGlobales(torneoGalactico);
            let listaTodos = Object.values(stats);

            listaTodos.sort((a, b) => b.puntosTotales - a.puntosTotales);

            let html = `
            <div class="contenedor-lista-global">
                <h3 class="titulo-tarjeta" style="font-size: 26px; margin-bottom: 20px;">RANKING GENERAL - 76 COMPETIDORES</h3>
            `;

            listaTodos.forEach((p, idx) => {
                const pos = idx + 1;
                let claseBadge = pos <= 19 ? "pos-top19" : pos <= 32 ? "pos-top32" : "pos-resto";
                let claseEstado = getClaseEstado(p.estado);

                html += `
                    <div class="fila-participante">
                        <span class="pos-badge ${claseBadge}">${pos}º</span>
                        <div class="info-participante">
                            <div class="nombre-contenedor">
                                <div style="display:flex; align-items:center; flex-wrap: wrap;">
                                    <span class="nombre">${p.nombre}</span>
                                    <span class="tag-grupo">(${p.grupoNombre})</span>
                                </div>
                                <span class="estado-tag ${claseEstado}">${p.estado}</span>
                                ${getRepHtml(p)}
                            </div>
                        </div>
                        <div class="caja-votos"><span class="preview-puntos">${p.puntosTotales} pts</span></div>
                    </div>`;
            });

            html += `</div>`;
            contenedor.innerHTML = html;
            if (isAdmin) asignarEventosInputsReps();
        }

        /* ----------------------------------------------------
           EVENTOS: CÁLCULO EN VIVO Y GUARDADO EN LA NUBE
        ---------------------------------------------------- */
        function asignarEventosInputsVotos() {
            document.querySelectorAll(".input-votos").forEach(input => {
                input.addEventListener("input", (e) => actualizarPuntosVisuales(e.target));
                
                input.addEventListener("change", (e) => {
                    let val = parseInt(e.target.value) || 0;
                    if (val < 0) val = 0;
                    e.target.value = val;

                    const tipo = e.target.getAttribute("data-tipo");
                    if (tipo === "grupo") {
                        const gId = e.target.getAttribute("data-grupo");
                        const pId = e.target.getAttribute("data-pid");
                        const grupo = torneoGalactico.grupos.find(g => g.id === gId);
                        grupo.participantes.find(p => p.id === pId).votos = val;
                    } else if (tipo === "llave") {
                        const r = e.target.getAttribute("data-ronda");
                        const lId = e.target.getAttribute("data-llave");
                        const target = e.target.getAttribute("data-target");
                        torneoGalactico.llaves[`ronda${r}`].find(l => l.id === lId)[target] = val;
                    }
                    guardarDatosEnNube();
                });
            });
        }

        function actualizarPuntosVisuales(inputModificado) {
            const tipo = inputModificado.getAttribute("data-tipo");
            let inputsRelacionados = [];
            
            if(tipo === "grupo") {
                inputsRelacionados = document.querySelectorAll(`.input-votos[data-grupo="${inputModificado.getAttribute('data-grupo')}"]`);
            } else {
                inputsRelacionados = document.querySelectorAll(`.input-votos[data-llave="${inputModificado.getAttribute('data-llave')}"]`);
            }

            let total = 0;
            inputsRelacionados.forEach(inp => total += (parseInt(inp.value)||0));
            inputsRelacionados.forEach(inp => {
                let pts = total > 0 ? Math.round(((parseInt(inp.value)||0) / total) * 1000) : 0;
                inp.parentElement.querySelector(".preview-puntos").innerText = `${pts} pts`;
            });
        }

        function asignarEventosInputsReps() {
            document.querySelectorAll(".input-rep").forEach(input => {
                input.addEventListener("change", (e) => {
                    const gId = e.target.getAttribute("data-grupo");
                    const pId = e.target.getAttribute("data-pid");
                    const grupo = torneoGalactico.grupos.find(g => g.id === gId);
                    if (grupo) {
                        grupo.participantes.find(p => p.id === pId).representante = e.target.value;
                        guardarDatosEnNube();
                    }
                });
            });
        }

        /* ----------------------------------------------------
           CERRAR FASE: CIERRE DE GRUPOS Y DESEMPATES
        ---------------------------------------------------- */
        document.getElementById("btn-cerrar-fase").addEventListener("click", () => {
            if (torneoGalactico.faseActual === "grupos") cerrarFaseGrupos();
            else avanzarRondaLlaves();
        });

        function cerrarFaseGrupos() {
            let directos = [];
            let todosLosSegundos = [];

            torneoGalactico.grupos.forEach(grupo => {
                let totalG = grupo.participantes.reduce((sum, p) => sum + p.votos, 0);
                
                let calculados = grupo.participantes.map(p => ({
                    ...p, 
                    ptsCalc: totalG > 0 ? Math.round((p.votos / totalG) * 1000) : 0
                })).sort((a, b) => b.ptsCalc - a.ptsCalc);
                
                if(calculados.length > 1) {
                    calculados[1].brecha = calculados[1].ptsCalc - (calculados.length > 2 ? calculados[2].ptsCalc : 0);
                }

                directos.push(calculados[0]);
                if (calculados.length > 1) todosLosSegundos.push(calculados[1]);
            });

            // Ordenar los 2dos lugares por Puntos y luego por Brecha sobre el 3ero
            todosLosSegundos.sort((a, b) => {
                if(b.ptsCalc !== a.ptsCalc) return b.ptsCalc - a.ptsCalc;
                return b.brecha - a.brecha; 
            });

            // Con 19 grupos: 19 primeros + 13 mejores segundos = 32 clasificados
            const mejoresSegundos = todosLosSegundos.slice(0, 13);

            if (directos.length + mejoresSegundos.length !== 32) return alert("Error: No se lograron 32 finalistas.");

            if (confirm("🌌 FASE DE GRUPOS CONCLUIDA.\nSe calcularon los puntos normalizados. ¿Generar llaves eliminatorias aleatorias?")) {
                const finalistasLimpios = [...directos, ...mejoresSegundos].map(f => {
                    let clean = {...f}; delete clean.ptsCalc; delete clean.brecha; return clean;
                });
                
                torneoGalactico.clasificados32 = finalistasLimpios;
                torneoGalactico.faseActual = "llaves";
                generarPrimeraRondaLlaves(finalistasLimpios);
            }
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generarPrimeraRondaLlaves(lista32) {
            const mezclados = shuffle(lista32);
            const llaves32 = [];
            for (let i = 0; i < 32; i += 2) {
                llaves32.push({ id: `L32-${i/2}`, p1: mezclados[i], p2: mezclados[i+1], votosP1: 0, votosP2: 0, ganador: null });
            }
            torneoGalactico.llaves["ronda32"] = llaves32;
            torneoGalactico.rondaLlavesActiva = 32;
            guardarDatosEnNube();
        }

        function avanzarRondaLlaves() {
            const rActiva = torneoGalactico.rondaLlavesActiva;
            const duelos = torneoGalactico.llaves[`ronda${rActiva}`];

            for (let duelo of duelos) {
                if (duelo.votosP1 === duelo.votosP2 && (duelo.votosP1 > 0 || duelo.votosP2 > 0)) {
                    return alert(`⚠️ EMPATE DETECTADO entre ${duelo.p1.nombre} y ${duelo.p2.nombre}.`);
                }
            }

            if (!confirm(`¿Confirmar cierre de la Ronda de ${rActiva} y avanzar a los ganadores?`)) return;

            const ganadores = duelos.map(d => { d.ganador = d.votosP1 > d.votosP2 ? d.p1 : d.p2; return d.ganador; });
            const sigRondaNum = rActiva / 2;

            if (sigRondaNum < 1) {
                torneoGalactico.campeon = ganadores[0];
                torneoGalactico.rondaLlavesActiva = 0;
            } else {
                const nuevasLlaves = [];
                for (let i = 0; i < ganadores.length; i += 2) {
                    nuevasLlaves.push({ id: `L${sigRondaNum}-${i/2}`, p1: ganadores[i], p2: ganadores[i+1], votosP1: 0, votosP2: 0, ganador: null });
                }
                torneoGalactico.llaves[`ronda${sigRondaNum}`] = nuevasLlaves;
                torneoGalactico.rondaLlavesActiva = sigRondaNum;
            }
            guardarDatosEnNube();
        }

        document.getElementById("btn-resetear").addEventListener("click", () => {
            if (confirm("⚠️ ¡ADVERTENCIA CRÍTICA!\n¿Estás seguro de querer borrar TODO?")) {
                torneoGalactico = generarEstructuraBase();
                guardarDatosEnNube();
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            inicializarFirebaseListener();
        });
    </script>
